# Keep the legacy DNS record and certificate so existing HTTPS links still work.
# Activate only after truck.diwuzhou.cn serves a valid HTTPS application.
server {
    listen 80;
    server_name struck.diwuzhou.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://truck.diwuzhou.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name struck.diwuzhou.cn;
    ssl_certificate /etc/letsencrypt/live/struck.diwuzhou.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/struck.diwuzhou.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://truck.diwuzhou.cn$request_uri;
}
