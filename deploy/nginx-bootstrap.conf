# Temporary HTTP-01 endpoint until this hostname has its own valid certificate.
server {
    listen 80;
    server_name struck.diwuzhou.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 503 "The Kunteng website is being configured.\n";
    }
}
