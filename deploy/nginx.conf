# Independent hostname; activate only after its certificate has been issued.
server {
    listen 80;
    server_name struck.diwuzhou.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://struck.diwuzhou.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name struck.diwuzhou.cn;
    ssl_certificate /etc/letsencrypt/live/struck.diwuzhou.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/struck.diwuzhou.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/struck.diwuzhou.cn.access.log;
    error_log /var/log/nginx/struck.diwuzhou.cn.error.log;
    client_max_body_size 20m;
    location /media/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
