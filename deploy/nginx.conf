# Add this virtual host to existing Nginx only after checking nginx -T.
# Replace certificate paths with the existing certificate for this hostname.
server {
    listen 80;
    server_name truck.diwuzhou.cn;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name truck.diwuzhou.cn;
    ssl_certificate /REPLACE/truck.diwuzhou.cn.fullchain.pem;
    ssl_certificate_key /REPLACE/truck.diwuzhou.cn.key;
    client_max_body_size 20m;
    location /media/contact/ {
        alias /opt/kunteng-truck/data/media/contact/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }
    location /media/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
