{% if item.image %}<figure class="port-photo {% if thumbnail %}photo-thumbnail{% endif %}"><a href="{% if thumbnail %}{{ item.get_absolute_url }}{% else %}{% url 'resource-image' item.slug %}{% endif %}"><img class="resource-image" src="{% url 'resource-image' item.slug %}?size={% if thumbnail %}card{% else %}detail{% endif %}" alt="{{ item.image_caption|default:item.title }}" loading="lazy" decoding="async"></a><figcaption>{% if not thumbnail %}{{ item.image_caption }} {% endif %}{% if item.image_taken_on %}拍摄：{{ item.image_taken_on }} · {% endif %}{% if item.image_source %}<a href="{{ item.image_source }}" target="_blank" rel="noopener noreferrer">{{ item.image_creator|default:'图片来源' }}</a>{% else %}{{ item.image_creator }}{% endif %}{% if item.image_license %} · {% if item.image_license_url %}<a href="{{ item.image_license_url }}" target="_blank" rel="noopener noreferrer">{{ item.image_license }}</a>{% else %}{{ item.image_license }}{% endif %}{% endif %}{% if item.image_note %}<span>{{ item.image_note }}</span>{% endif %}<span>网页显示图已缩放压缩。{% if not thumbnail %}<a href="{% url 'resource-image' item.slug %}" target="_blank" rel="noopener noreferrer">查看原图 ↗</a>{% endif %}</span></figcaption></figure>{% endif %}
