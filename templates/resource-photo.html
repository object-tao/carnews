{% if item.image %}<figure class="port-photo {% if thumbnail %}photo-thumbnail{% endif %}"><a href="{{ item.get_absolute_url }}"><img class="resource-image" src="{% url 'resource-image' item.slug %}" alt="{{ item.image_caption|default:item.title }}" loading="lazy"></a><figcaption>{% if not thumbnail %}{{ item.image_caption }} {% endif %}{% if item.image_taken_on %}拍摄：{{ item.image_taken_on }} · {% endif %}{% if item.image_source %}<a href="{{ item.image_source }}" target="_blank" rel="noopener noreferrer">{{ item.image_creator|default:'图片来源' }}</a>{% else %}{{ item.image_creator }}{% endif %}{% if item.image_license %} · {% if item.image_license_url %}<a href="{{ item.image_license_url }}" target="_blank" rel="noopener noreferrer">{{ item.image_license }}</a>{% else %}{{ item.image_license }}{% endif %}{% endif %}{% if not thumbnail %}<span>历史实景资料图，不代表当前设施或通关状态；使用 Commons 缩略版本，未改动图像内容。</span>{% endif %}</figcaption></figure>{% endif %}
